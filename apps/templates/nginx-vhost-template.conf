# Nginx VirtualHost Template for Multi-Project Home Server
# Copy to /etc/nginx/sites-available/your-app.conf and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name app2.yourdomain.com app2.local;

    # Dynamic asset handling / static files
    location /static/ {
        alias /var/www/your-app/static/;
        expires 30d;
    }

    # Reverse proxy to background application service (Node, Rails, Python, Docker, etc.)
    location / {
        proxy_pass http://127.0.0.1:8080; # Replace with your app port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
