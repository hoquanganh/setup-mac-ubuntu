# Docker Compose Template for Multi-Project Home Server
version: '3.8'

services:
  web_app:
    image: nginx:alpine
    container_name: sample_app
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./app_data:/usr/share/nginx/html:ro

  database:
    image: postgres:16-alpine
    container_name: sample_app_db
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
