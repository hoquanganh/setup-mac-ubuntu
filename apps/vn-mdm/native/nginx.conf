# Nginx configuration for VN-MDM Home Server
# Proxying Admin API, Multi-tenant MDM, ADE, VPP, and Enterprise Apps to Rails (:3000)
# Proxying Admin Web UI to Next.js (:3001)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Backend API & Device MDM Endpoints
    # Matches /api/*, /up, /mdm/*, /enroll/* AND multi-tenant /:alias/(mdm|enroll|apps|vpp)
    location ~ ^/(api|up|mdm|enroll|[^/]+/(mdm|enroll|apps|vpp)) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Web Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
